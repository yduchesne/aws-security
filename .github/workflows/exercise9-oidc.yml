name: Exercise 9 GitHub OIDC

on:
  push:
    branches:
      - dev/oidc/main # Must match refs/heads/<branch> in TF_VAR_oidc_subject.

permissions:
  id-token: write
  contents: read

jobs:
  oidc-positive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify GitHub ref
        shell: bash
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"

      - name: Inspect OIDC claims
        shell: bash
        run: |
           set -euo pipefail

           token_file="$RUNNER_TEMP/exercise9-oidc-token.jwt"

           curl --fail --silent --show-error \
             --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
             jq -er '.value' > "$token_file"

           chmod 600 "$token_file"

           python3 - "$token_file" <<'PY'
           import base64
           import json
           import sys

           token = open(sys.argv[1], encoding="utf-8").read().strip()
           payload = token.split(".")[1]
           payload += "=" * (-len(payload) % 4)

           claims = json.loads(base64.urlsafe_b64decode(payload))

           print(json.dumps({
               key: claims.get(key)
               for key in (
                   "iss",
                   "aud",
                   "sub",
                   "repository",
                   "repository_owner",
                   "ref",
                   "workflow",
                   "job_workflow_ref",
                   "environment",
               )
           }, indent=2))
           PY

      - name: Verify role variable is configured
        shell: bash
        env:
          EXERCISE9_ROLE_ARN: ${{ vars.EXERCISE9_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$EXERCISE9_ROLE_ARN"
          case "$EXERCISE9_ROLE_ARN" in
            arn:aws:iam::*:role/*) ;;
            *) echo "EXERCISE9_ROLE_ARN is not a valid IAM role ARN" >&2; exit 1 ;;
          esac
          echo "EXERCISE9_ROLE_ARN is configured"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EXERCISE9_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: exercise9-github-positive

      - name: Verify the federated identity
        run: aws sts get-caller-identity --no-cli-pager

